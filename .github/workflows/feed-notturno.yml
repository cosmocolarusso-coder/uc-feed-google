name: Feed Google notturno

on:
  schedule:
    - cron: '30 1 * * *'   # 01:30 UTC = 03:30 in Italia (02:30 con l'ora solare)
  workflow_dispatch:        # avvio manuale dalla scheda Actions
    inputs:
      max_chiamate:
        description: 'Budget di chiamate API (es. 3000 per rigenerare i file dai dati salvati senza consumare la quota della notte)'
        required: false
        default: '90000'

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write            # salvare la cache dello stato

concurrency:
  group: feed
  cancel-in-progress: false

jobs:
  genera:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # stato del giro precedente (schede e traduzioni già lette): privato, non pubblicato
      - uses: actions/cache/restore@v4
        with:
          path: stato
          key: stato-${{ github.run_id }}
          restore-keys: stato-
      - name: Genera i feed
        env:
          STOREDEN_KEY: ${{ secrets.STOREDEN_KEY }}
          STOREDEN_EXCHANGE: ${{ secrets.STOREDEN_EXCHANGE }}
          MAX_CHIAMATE: ${{ inputs.max_chiamate || '90000' }}
        run: python3 -I genera_feed.py
      - uses: actions/cache/save@v4
        if: always() && hashFiles('stato/stato.json.gz') != ''
        with:
          path: stato
          key: stato-${{ github.run_id }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
      - id: deploy
        uses: actions/deploy-pages@v4
