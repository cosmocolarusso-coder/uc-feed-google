name: Feed Google notturno

on:
  # [CHG-1093.4] Più orari invece del solo 01:30 UTC: dal 17/11/2026 GitHub avvia i giri programmati con 7–10 ore di
  # ritardo (partiti fra 08:28 e 11:23 UTC), dopo la lettura di Merchant Center (08:00 in Italia = 07:00 UTC), che
  # prendeva il feed del giorno prima. Con quattro orari almeno uno arriva prima delle 07:00 UTC anche con 10 ore di
  # ritardo; un giro programmato che parte meno di 2 ore dopo l'ultima pubblicazione non rifà il lavoro (job «controlla»).
  # Minuto 17: GitHub sconsiglia l'inizio dell'ora, il momento più carico.
  schedule:
    - cron: '17 18 * * *'   # 19:17 in Italia (ora solare)
    - cron: '17 21 * * *'   # 22:17
    - cron: '17 0 * * *'    # 01:17
    - cron: '17 3 * * *'    # 04:17
  workflow_dispatch:        # avvio manuale dalla scheda Actions
    inputs:
      max_chiamate:
        description: 'Budget di chiamate API (es. 3000 per rigenerare i file dai dati salvati senza consumare la quota della notte)'
        required: false
        default: '90000'

permissions:
  contents: write          # ramo clerk-categorie (vedi sotto)
  pages: write
  id-token: write
  actions: write            # salvare la cache dello stato

concurrency:
  group: feed
  cancel-in-progress: false

jobs:
  # [CHG-1093.4] Giro programmato già fatto da poco? ultimo-giro.txt (pubblicato a ogni giro) ha l'ora dell'ultima
  # pubblicazione: sotto le 2 ore il giro programmato si ferma qui. L'avvio a mano lavora sempre.
  controlla:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      fare: ${{ steps.c.outputs.fare }}
    steps:
      - id: c
        env:
          EVENTO: ${{ github.event_name }}
        run: |
          fare=true
          if [ "$EVENTO" = "schedule" ]; then
            t="$(curl -fsS --max-time 30 "https://cosmocolarusso-coder.github.io/uc-feed-google/ultimo-giro.txt?$(date +%s)" 2>/dev/null | head -1 | cut -d' ' -f1 || true)"
            if [ -n "$t" ] && [ "$t" -eq "$t" ] 2>/dev/null; then
              eta=$(( $(date -u +%s) - t ))
              echo "ultima pubblicazione $(( eta / 60 )) minuti fa"
              if [ "$eta" -lt 7200 ]; then fare=false; echo "giro saltato: feed pubblicati da meno di 2 ore"; fi
            fi
          fi
          echo "fare=$fare" >> "$GITHUB_OUTPUT"
  genera:
    needs: controlla
    if: needs.controlla.outputs.fare == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # stato del giro precedente (schede e traduzioni già lette): privato, non pubblicato
      - uses: actions/cache/restore@v4
        with:
          path: stato
          key: stato-${{ github.run_id }}
          restore-keys: stato-
      # Pillow per misurare le foto del configuratore pavimenti (configuratore.py)
      - run: pip install --quiet "pillow==13.0.0"   # versione fissata: niente aggiornamenti non verificati
      - name: Genera i feed
        env:
          STOREDEN_KEY: ${{ secrets.STOREDEN_KEY }}
          STOREDEN_EXCHANGE: ${{ secrets.STOREDEN_EXCHANGE }}
          MAX_CHIAMATE: ${{ inputs.max_chiamate || '90000' }}
          MAX_IMMAGINI: '10000'
        # [CHG-1000] Con tutte e 5 le lingue da Shopify (passaggio del 21/11/2026) Storeden non serve più: se il giro
        # partisse lo stesso e Storeden fosse fermo, il lavoro si fermerebbe qui e i feed Shopify non verrebbero pubblicati.
        run: |
          L="$(tr -d '[:space:]' < lingue-shopify.txt 2>/dev/null || true)"
          if [ "$(echo "$L" | tr ',' '\n' | grep -c .)" -ge 5 ]; then
            echo "tutte le lingue da Shopify ($L): giro Storeden saltato"; mkdir -p out; exit 0
          fi
          python3 -I genera_feed.py
      # [CHG-949] Prova generale: le lingue elencate in lingue-shopify.txt (es. «de,es») prendono i feed Google e Meta da
      # SHOPIFY (feed_shopify.py), con gli stessi nomi di file: Merchant Center e Meta non vanno toccati. Le altre lingue
      # restano da Storeden. File vuoto = tutto da Storeden. Dal 30/11/2026: de,es; dal 7/12: it,en,fr,de,es.
      - name: Feed da Shopify per le lingue in lingue-shopify.txt
        env:
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          SHOPIFY_SHOP: ${{ vars.SHOPIFY_SHOP || 'wmprxj-bx.myshopify.com' }}
        run: |
          L="$(tr -d '[:space:]' < lingue-shopify.txt 2>/dev/null || true)"
          if [ -z "$L" ]; then echo "lingue-shopify.txt vuoto: feed tutti da Storeden"; exit 0; fi
          python3 -I feed_shopify.py --lingue "$L"
          for l in $(echo "$L" | tr ',' ' '); do
            cp "out/shopify/feed-$l.xml.gz" "out/feed-$l.xml.gz"
            cp "out/shopify/feed-meta-$l.xml.gz" "out/feed-meta-$l.xml.gz"
            echo "feed-$l e feed-meta-$l da Shopify"
          done
      - uses: actions/cache/save@v4
        if: always() && hashFiles('stato/stato.json.gz') != ''
        with:
          path: stato
          key: stato-${{ github.run_id }}
      # Categorie Clerk anche su raw.githubusercontent.com (ramo orfano riscritto ogni notte):
      # Clerk le scarica subito dopo il file prodotti da ~100 MB e sulla stessa connessione
      # di github.io riceveva «Connection reset by peer»; con un altro host apre una connessione nuova.
      - name: Pubblica le categorie Clerk sul ramo clerk-categorie
        if: hashFiles('out/clerk/categories-it_IT.json') != ''
        run: |
          mkdir /tmp/cat && cp out/clerk/categories-*.json /tmp/cat/ && cd /tmp/cat
          git init -q -b clerk-categorie
          git add . && git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -q -m "Categorie Clerk ${{ github.run_id }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" clerk-categorie
      # File fissi pubblicati insieme ai feed (foto di copertina del configuratore pavimenti: static/img)
      - run: cp -r static/. out/
      # [CHG-1093.4] ora della pubblicazione (secondi dal 1970, ora UTC leggibile, giro): la legge il job «controlla»
      - run: |
          echo "$(date -u '+%s %Y-%m-%dT%H:%M:%SZ') run ${{ github.run_id }} ${{ github.event_name }}" > out/ultimo-giro.txt
          cat out/ultimo-giro.txt
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
      - id: deploy
        uses: actions/deploy-pages@v4
