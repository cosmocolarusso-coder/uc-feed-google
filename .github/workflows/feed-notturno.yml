name: Feed Google notturno

on:
  schedule:
    - cron: '30 1 * * *'   # 01:30 UTC = 03:30 in Italia (02:30 con l'ora solare)
  workflow_dispatch:        # avvio manuale dalla scheda Actions
    inputs:
      max_chiamate:
        description: 'Budget di chiamate API (es. 3000 per rigenerare i file dai dati salvati senza consumare la quota della notte)'
        required: false
        default: '90000'

permissions:
  contents: write          # ramo clerk-categorie (vedi sotto)
  pages: write
  id-token: write
  actions: write            # salvare la cache dello stato

concurrency:
  group: feed
  cancel-in-progress: false

jobs:
  genera:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # stato del giro precedente (schede e traduzioni già lette): privato, non pubblicato
      - uses: actions/cache/restore@v4
        with:
          path: stato
          key: stato-${{ github.run_id }}
          restore-keys: stato-
      # Pillow per misurare le foto del configuratore pavimenti (configuratore.py)
      - run: pip install --quiet "pillow==13.0.0"   # versione fissata: niente aggiornamenti non verificati
      - name: Genera i feed
        env:
          STOREDEN_KEY: ${{ secrets.STOREDEN_KEY }}
          STOREDEN_EXCHANGE: ${{ secrets.STOREDEN_EXCHANGE }}
          MAX_CHIAMATE: ${{ inputs.max_chiamate || '90000' }}
          MAX_IMMAGINI: '10000'
        run: python3 -I genera_feed.py
      - uses: actions/cache/save@v4
        if: always() && hashFiles('stato/stato.json.gz') != ''
        with:
          path: stato
          key: stato-${{ github.run_id }}
      # Categorie Clerk anche su raw.githubusercontent.com (ramo orfano riscritto ogni notte):
      # Clerk le scarica subito dopo il file prodotti da ~100 MB e sulla stessa connessione
      # di github.io riceveva «Connection reset by peer»; con un altro host apre una connessione nuova.
      - name: Pubblica le categorie Clerk sul ramo clerk-categorie
        if: hashFiles('out/clerk/categories-it_IT.json') != ''
        run: |
          mkdir /tmp/cat && cp out/clerk/categories-*.json /tmp/cat/ && cd /tmp/cat
          git init -q -b clerk-categorie
          git add . && git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -q -m "Categorie Clerk ${{ github.run_id }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" clerk-categorie
      # File fissi pubblicati insieme ai feed (foto di copertina del configuratore pavimenti: static/img)
      - run: cp -r static/. out/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
      - id: deploy
        uses: actions/deploy-pages@v4
